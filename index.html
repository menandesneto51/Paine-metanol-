<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Painel de Monitoramento – Intoxicação por Metanol (SES-MT)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--b:#2563eb;--r:#dc2626;--y:#eab308;--g:#15803d;--p:#7c3aed;--s:#334155;--o:#ea580c;--i:#4f46e5;--bd:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#f8fafc,#eff6ff);color:#1e293b}.wrap{width:min(1320px,calc(100% - 30px));margin:auto}
header{background:#fff;border-bottom:1px solid var(--bd);box-shadow:0 1px 4px #0f172a14}.logos{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding:18px 0}.logos img{height:58px;max-width:31%;object-fit:contain}
.hero{text-align:center;padding:30px 0 20px}.hero h1{font-size:clamp(30px,5vw,52px);margin:0}.hero p{font-size:clamp(17px,2vw,22px);font-weight:700;color:#1d4ed8;margin:8px 0 0}
.update,.warning,.error{padding:14px 18px;border-radius:10px;margin-bottom:18px;box-shadow:0 2px 8px #0f172a12}.update{background:#fffbeb;border-left:5px solid #f59e0b;color:#92400e;text-align:center}.warning{background:#fef2f2;border-left:5px solid #dc2626;color:#991b1b}.error{background:#fff7ed;border-left:5px solid #ea580c;color:#9a3412}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:26px 0}.kpi{background:#fff;border-radius:13px;padding:16px;box-shadow:0 3px 12px #0f172a14;border-top:5px solid var(--c);min-height:130px}.kh{display:flex;justify-content:space-between;gap:10px}.kl{text-transform:uppercase;font-size:11px;font-weight:800;color:#64748b}.ki{font-size:24px}.kv{font-size:41px;font-weight:800;color:var(--c);margin-top:20px}.muted{font-size:13px;color:#64748b;margin:4px 0}
.tabs{background:#fff;padding:8px;border-radius:12px;display:flex;gap:8px;flex-wrap:wrap;box-shadow:0 3px 12px #0f172a14;margin-bottom:25px}.tab{border:0;background:#f1f5f9;color:#475569;padding:13px 17px;border-radius:9px;font-weight:700;cursor:pointer;flex:1;min-width:135px}.tab.active{background:var(--c);color:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.st{font-size:18px;font-weight:800;color:var(--c);margin:0 0 10px}.list{background:#fff;border-radius:14px;padding:17px;border-left:8px solid var(--c);box-shadow:0 3px 12px #0f172a14}.card{border:1px solid var(--bd);border-radius:12px;padding:15px;margin-bottom:13px;background:#fff;cursor:pointer;transition:.15s}.card:hover{box-shadow:0 5px 16px #0f172a1f;transform:translateY(-1px)}.card:last-child{margin-bottom:0}.row{display:flex;gap:11px;align-items:flex-start}.badge{display:inline-flex;gap:5px;align-items:center;background:var(--c);color:#fff;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800;white-space:nowrap}.content{flex:1;min-width:0}.primary{font-weight:750;margin:0 0 5px}.desc{font-size:14px;color:#475569;border-left:2px solid #cbd5e1;padding-left:10px;margin:11px 0}.info{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:12px;color:#64748b}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;margin:4px 4px 5px 0}.met{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}.other{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}.issue{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
.mapbox{background:#fff;border-radius:14px;padding:20px;box-shadow:0 3px 12px #0f172a14}.mapbox h2{color:#6d28d9;margin:0 0 8px}#map{height:520px;border:1px solid var(--bd);border-radius:12px;background:#e2e8f0}.cities{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}.city{border:1px solid var(--bd);background:#f8fafc;border-radius:9px;padding:12px}.ch{display:flex;justify-content:space-between;font-weight:800}.cs{font-size:12px;color:#64748b;margin-top:5px}
.modal{position:fixed;inset:0;background:#0f172a99;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}.hidden{display:none}.modal-card{background:#fff;border-radius:16px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:23px;box-shadow:0 24px 70px #0006}.mh{display:flex;justify-content:space-between;gap:15px}.close{border:0;background:transparent;font-size:32px;cursor:pointer;color:#64748b}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.detail{background:#f8fafc;border:1px solid var(--bd);border-radius:9px;padding:11px}.detail b{display:block;font-size:11px;text-transform:uppercase;color:#64748b;margin-bottom:4px}.dsc{background:#eff6ff;border-left:4px solid #3b82f6;border-radius:9px;padding:14px;margin-top:15px}.issues{background:#fff7ed;border:1px solid #fed7aa;border-radius:9px;padding:12px;color:#9a3412;margin-top:12px}.footer{text-align:center;font-size:12px;color:#64748b;padding:28px 0}
@media(max-width:1100px){.grid3{grid-template-columns:1fr}.cities{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.logos{justify-content:center}.logos img{height:46px;max-width:46%}.row{flex-direction:column}.info,.details{grid-template-columns:1fr}.cities{grid-template-columns:1fr}#map{height:430px}}
</style>
</head>
<body>
<header><div class="wrap logos"><img src="https://raw.githubusercontent.com/luishgm/imagens-para-projetos/main/logos/cievs.png" alt="CIEVS MT"><img src="https://raw.githubusercontent.com/luishgm/imagens-para-projetos/main/logos/rede-cievs.png" alt="Rede CIEVS"><img src="https://raw.githubusercontent.com/luishgm/imagens-para-projetos/main/logos/logo-governo-mato-grosso.png" alt="Governo MT"></div></header>
<main class="wrap"><section class="hero"><h1>Painel de Monitoramento</h1><p>Intoxicação por suspeita de metanol — SES-MT</p></section><div class="update">📅 <strong>Base atualizada em 06/08/2026</strong></div><div id="quality"></div><section id="kpis" class="kpis"></section><nav id="tabs" class="tabs"></nav><section id="main"><div class="update">Carregando dados…</div></section><footer class="footer">Fonte: CIEVS-MT / SES-MT. Informações desidentificadas para proteção de dados pessoais.</footer></main>
<div id="modal" class="modal hidden"><div id="modal-card" class="modal-card"></div></div>
<script>
const COORDS={"Cuiabá":[-15.601,-56.097],"Várzea Grande":[-15.646,-56.132],"Sorriso":[-12.542,-55.721],"Água Boa":[-14.049,-52.16],"Nova Mutum":[-13.837,-56.074],"Peixoto de Azevedo":[-10.225,-54.979],"Itanhangá":[-12.255,-56.646],"Nova Brasilândia":[-14.961,-54.301],"Querência":[-12.593,-52.197],"Juína":[-11.3728,-58.7482],"Novo Santo Antônio":[-12.287,-50.968]};
const STATUS={"CONFIRMADO":{icon:"⚠️",color:"#dc2626"},"EM INVESTIGAÇÃO":{icon:"🔍",color:"#eab308"},"DESCARTADO":{icon:"✅",color:"#15803d"}};
let CASOS=[],tab="geral",map=null;
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
const groups=()=>({confirmados:CASOS.filter(c=>c.status==="CONFIRMADO"),investigacao:CASOS.filter(c=>c.status==="EM INVESTIGAÇÃO"),descartados:CASOS.filter(c=>c.status==="DESCARTADO")});
function totals(){const g=groups();return{notificados:CASOS.length,confirmados:g.confirmados.length,investigacao:g.investigacao.length,descartados:g.descartados.length,met:CASOS.filter(c=>c.obito==="Sim"&&c.tipoObito==="Óbito por metanol").length,other:CASOS.filter(c=>c.obito==="Sim"&&c.tipoObito==="Óbito por outras causas").length,internados:CASOS.filter(c=>c.internado==="Sim").length,antidoto:CASOS.filter(c=>c.antidoto==="Sim").length,bad:CASOS.filter(c=>(c.inconsistencias||[]).length).length}}
function distribution(){const d={};CASOS.forEach(c=>{if(!d[c.residencia])d[c.residencia]={municipio:c.residencia,total:0,confirmados:0,investigacao:0,descartados:0,met:0,other:0};const x=d[c.residencia];x.total++;if(c.status==="CONFIRMADO")x.confirmados++;if(c.status==="EM INVESTIGAÇÃO")x.investigacao++;if(c.status==="DESCARTADO")x.descartados++;if(c.obito==="Sim"&&c.tipoObito==="Óbito por metanol")x.met++;if(c.obito==="Sim"&&c.tipoObito==="Óbito por outras causas")x.other++});return Object.values(d).sort((a,b)=>b.total-a.total)}
function renderQuality(){const t=totals();document.getElementById("quality").innerHTML=t.bad?`<div class="warning"><strong>⚠️ Controle de qualidade: ${t.bad} registros possuem inconsistências.</strong><br>Os KPIs refletem os campos atualmente preenchidos na planilha. Os registros sinalizados ainda exigem validação documental.</div>`:""}
function renderKpis(){const t=totals(),a=[["Notificados",t.notificados,"👥","#2563eb"],["Confirmados",t.confirmados,"⚠️","#dc2626"],["Em investigação",t.investigacao,"🔍","#eab308"],["Descartados",t.descartados,"✅","#15803d"],["Óbitos por metanol",t.met,"☠️","#b91c1c"],["Óbitos por outras causas",t.other,"⚫","#475569"],["Atualmente internados",t.internados,"🏥","#ea580c"],["Receberam antídoto",t.antidoto,"💉","#4f46e5"]];document.getElementById("kpis").innerHTML=a.map(([l,v,i,c])=>`<article class="kpi" style="--c:${c}"><div class="kh"><span class="kl">${l}</span><span class="ki">${i}</span></div><div class="kv">${v}</div><div class="muted">${v===1?"caso":"casos"}</div></article>`).join("")}
function renderTabs(){const a=[["geral","Visão geral","#2563eb"],["confirmados","Confirmados","#dc2626"],["investigacao","Em investigação","#eab308"],["descartados","Descartados","#15803d"],["mapa","Mapa","#7c3aed"]];document.getElementById("tabs").innerHTML=a.map(([id,l,c])=>`<button class="tab ${tab===id?"active":""}" style="--c:${c}" data-id="${id}">${l}</button>`).join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.id;renderTabs();renderMain()})}
function death(c){if(c.obito==="Sim"&&c.tipoObito==="Óbito por metanol")return`<span class="pill met">☠️ Óbito por metanol</span>`;if(c.obito==="Sim"&&c.tipoObito==="Óbito por outras causas")return`<span class="pill other">⚫ Óbito por outras causas</span>`;return""}
function card(c){const s=STATUS[c.status]||{icon:"•",color:"#64748b"},n=(c.inconsistencias||[]).length;return`<article class="card" data-id="${c.id}"><div class="row"><span class="badge" style="--c:${s.color}">${s.icon} ${esc(c.status)}</span><div class="content"><p class="primary">📍 Residência: ${esc(c.residencia)}</p><p class="muted">🏥 Internação: ${esc(c.internacao)}</p><p class="muted">(${esc(c.perfil)})</p><p class="muted">Notificação: ${esc(c.data)}</p><p class="desc">${esc(c.descricao)}</p>${death(c)}${n?`<span class="pill issue">⚠️ ${n} inconsistência(s)</span>`:""}<div class="info"><div><b>Evolução:</b> ${esc(c.evolucao)}</div><div><b>Gravidade:</b> ${esc(c.gravidade)}</div><div><b>Hospitalização:</b> ${esc(c.hospitalizou)}</div><div><b>Permanece hospitalizado:</b> ${esc(c.internado)}</div><div><b>Recebeu antídoto:</b> ${esc(c.antidoto)}</div><div><b>Óbito?</b> ${esc(c.obito)}</div><div><b>Tipo de óbito:</b> ${esc(c.tipoObito)}</div>${c.dataObito?`<div><b>Data do óbito:</b> ${esc(c.dataObito)}</div>`:""}</div></div></div></article>`}
function section(t,d,c,i){return`<section style="--c:${c}"><h2 class="st">${i} ${t}</h2><div class="list">${d.map(card).join("")||"<p>Nenhum registro.</p>"}</div></section>`}
function bind(){document.querySelectorAll(".card").forEach(x=>x.onclick=()=>openModal(Number(x.dataset.id)))}
function renderMain(){const g=groups(),r=document.getElementById("main");if(tab==="geral"){r.innerHTML=`<div class="grid3">${section("Confirmados",g.confirmados,"#dc2626","⚠️")}${section("Em investigação",g.investigacao,"#eab308","🔍")}${section("Descartados",g.descartados,"#15803d","✅")}</div>`;bind();return}if(tab==="confirmados"){r.innerHTML=section("Casos confirmados",g.confirmados,"#dc2626","⚠️");bind();return}if(tab==="investigacao"){r.innerHTML=section("Casos em investigação",g.investigacao,"#eab308","🔍");bind();return}if(tab==="descartados"){r.innerHTML=section("Casos descartados",g.descartados,"#15803d","✅");bind();return}renderMap()}
function renderMap(){const d=distribution(),r=document.getElementById("main");r.innerHTML=`<section class="mapbox"><h2>📍 Distribuição espacial dos casos</h2><p>Distribuição por município de residência.</p><div id="map"></div><div class="cities">${d.map(m=>`<div class="city"><div class="ch"><span>${esc(m.municipio)}</span><span>${m.total}</span></div><div class="cs">Confirmados: ${m.confirmados} · Investigação: ${m.investigacao} · Descartados: ${m.descartados} · Óbitos por metanol: ${m.met} · Outros óbitos: ${m.other}</div></div>`).join("")}</div></section>`;if(typeof L==="undefined"){document.getElementById("map").innerHTML="<div style='padding:40px;text-align:center'>O mapa depende de conexão com a internet.</div>";return}if(map){map.remove();map=null}map=L.map("map").setView([-13.7,-56],5);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"&copy; OpenStreetMap"}).addTo(map);const bounds=[];d.forEach(m=>{const p=COORDS[m.municipio];if(!p)return;bounds.push(p);const c=m.confirmados?"#dc2626":m.investigacao?"#eab308":"#15803d";L.circleMarker(p,{radius:7+m.total*2,color:c,fillColor:c,fillOpacity:.8,weight:2}).bindPopup(`<b>${m.municipio}</b><br>Total: ${m.total}<br>Confirmados: ${m.confirmados}<br>Em investigação: ${m.investigacao}<br>Descartados: ${m.descartados}<br>Óbitos por metanol: ${m.met}<br>Óbitos por outras causas: ${m.other}`).addTo(map)});setTimeout(()=>{map.invalidateSize();if(bounds.length>1)map.fitBounds(bounds,{padding:[25,25]})},100)}
function openModal(id){const c=CASOS.find(x=>x.id===id),s=STATUS[c.status]||{icon:"•",color:"#64748b"},issues=c.inconsistencias||[];document.getElementById("modal-card").innerHTML=`<div class="mh"><div><h2 style="margin:0">Detalhes do caso</h2><span class="badge" style="--c:${s.color};margin-top:10px">${s.icon} ${esc(c.status)}</span></div><button class="close" onclick="closeModal()">&times;</button></div>${death(c)}<div class="details"><div class="detail"><b>Residência</b>${esc(c.residencia)}</div><div class="detail"><b>Internação</b>${esc(c.internacao)}</div><div class="detail"><b>Perfil</b>${esc(c.perfil)}</div><div class="detail"><b>Notificação</b>${esc(c.data)}</div><div class="detail"><b>Gravidade</b>${esc(c.gravidade)}</div><div class="detail"><b>Evolução</b>${esc(c.evolucao)}</div><div class="detail"><b>Hospitalização</b>${esc(c.hospitalizou)}</div><div class="detail"><b>Permanece hospitalizado</b>${esc(c.internado)}</div><div class="detail"><b>Recebeu antídoto</b>${esc(c.antidoto)}</div><div class="detail"><b>Óbito?</b>${esc(c.obito)}</div><div class="detail"><b>Tipo de óbito</b>${esc(c.tipoObito)}</div><div class="detail"><b>Data do óbito</b>${esc(c.dataObito||"Não informada")}</div></div><div class="dsc">${esc(c.descricao)}</div>${c.observacoes?`<div class="issues"><b>Observações:</b> ${esc(c.observacoes)}</div>`:""}${issues.length?`<div class="issues"><b>Validação automática:</b><ul>${issues.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`:""}`;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
fetch("./casos_metanol.json?v=20260806",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(d=>{CASOS=d;renderQuality();renderKpis();renderTabs();renderMain()}).catch(e=>{document.getElementById("main").innerHTML=`<div class="error"><strong>Não foi possível carregar a base de dados.</strong><br>${esc(e.message)}</div>`});
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" onload="if(tab==='mapa'&&CASOS.length)renderMap()"></script>
</body>
</html>
